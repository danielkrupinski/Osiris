name: IWYU

on: workflow_dispatch

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: install libclang-22-dev
      run: |
        sudo apt-get update
        sudo apt-get install libclang-22-dev
    - name: build include-what-you-use
      run: |
        git clone --depth=1 --single-branch --branch clang_22 https://github.com/include-what-you-use/include-what-you-use.git
        cd include-what-you-use
        cmake -DCMAKE_PREFIX_PATH=/usr/lib/llvm-22 -B build
        cmake --build build
    - name: configure
      run: CXX=clang++-22 cmake -Werror=dev -D CMAKE_BUILD_TYPE=Release -D CMAKE_CXX_INCLUDE_WHAT_YOU_USE="$PWD/include-what-you-use/build/bin/include-what-you-use;-Xiwyu;--no_fwd_decls;-Xiwyu;--check_also=$PWD/Source/**/*.h" -B build
    - name: run include-what-you-use
      run: cmake --build build
