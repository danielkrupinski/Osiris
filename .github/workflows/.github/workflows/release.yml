name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v2026.10.07
        type: string
      name:
        description: Release name
        required: true
        default: Osiris 2026-10-07
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v7

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Build Release DLL
      shell: cmd
      run: msbuild Osiris.sln /p:Platform=x64 /p:Configuration=Release

    - name: Prepare release files
      shell: pwsh
      run: |
        $dll = Get-ChildItem -Path . -Recurse -Filter Osiris.dll |
          Where-Object { $_.FullName -match '\\x64\\Release\\Osiris\.dll$' } |
          Select-Object -First 1
        if (-not $dll) {
          Write-Error 'Release DLL was not found'
          exit 1
        }
        New-Item -ItemType Directory -Force -Path dist | Out-Null
        Copy-Item $dll.FullName 'dist/Osiris-Windows-x64.dll'
        (Get-FileHash 'dist/Osiris-Windows-x64.dll' -Algorithm SHA256).Hash |
          Set-Content 'dist/Osiris-Windows-x64.dll.sha256'

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag }}
        name: ${{ inputs.name }}
        generate_release_notes: true
        files: |
          dist/Osiris-Windows-x64.dll
          dist/Osiris-Windows-x64.dll.sha256
